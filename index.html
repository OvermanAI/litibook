  <!-- Image Target 資料（在 XR8 載入前備妥） -->

      "type": "PLANAR",

        "left": 93, "top": 0, "width": 997, "height": 1329,

        "luminanceImage": "litibook_luminance.png"

      "created": 1780823548416,
      "updated": 1780823548416

    const onxrloaded = () => {
      XR8.XrController.configure({ imageTargetData: [LITIBOOK_TARGET] });

    window.XR8 ? onxrloaded() : window.addEventListener('xrloaded', onxrloaded);

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: -apple-system, sans-serif; }

    #hint {
      position: fixed;
      bottom: 48px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #fff;
      padding: 12px 24px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 9999;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }
    #hint.hidden { opacity: 0; }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #fff;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.7); }
    }

    #detected-flash {
      position: fixed; inset: 0;
      background: radial-gradient(circle, rgba(255,220,100,0.3) 0%, transparent 70%);
      pointer-events: none;
      z-index: 9998;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    #detected-flash.show { opacity: 1; }
  </style>
</head>

  <script>
    // 光點粒子生成
    AFRAME.registerComponent('spawn-sparkles', {
      init: function () {
        const container = document.getElementById('sparkles-container');
        const colors = ['#B0E0FF', '#D0F0FF', '#FFEEDD', '#FFD6FF', '#C0FFE0', '#FFFACD'];

        for (let i = 0; i < 28; i++) {
          const el = document.createElement('a-sphere');
          const x = (Math.random() - 0.5) * 0.90;
          const y = (Math.random() - 0.5) * 0.80;
          const z = 0.02 + Math.random() * 0.09;
          const r = 0.006 + Math.random() * 0.010;
          const dur = 700 + Math.random() * 1800;
          const delay = Math.random() * 2500;
          const fromScale = (0.2 + Math.random() * 0.4).toFixed(2);
          const color = colors[Math.floor(Math.random() * colors.length)];

          el.setAttribute('position', `${x.toFixed(3)} ${y.toFixed(3)} ${z.toFixed(3)}`);
          el.setAttribute('radius', r.toFixed(4));
          el.setAttribute('color', color);
          el.setAttribute('emissive', color);
          el.setAttribute('emissive-intensity', '0.8');
          el.setAttribute('metalness', '0');
          el.setAttribute('roughness', '1');
          el.setAttribute('animation', `property: scale; from: ${fromScale} ${fromScale} ${fromScale}; to: 1 1 1; dur: ${Math.round(dur)}; delay: ${Math.round(delay)}; easing: easeInOutSine; loop: true; dir: alternate`);

          container.appendChild(el);
        }
      }
    });

    document.querySelector('a-scene').setAttribute('spawn-sparkles', '');

    // UI 回饋：偵測到書頁
    const hint  = document.getElementById('hint');
    const flash = document.getElementById('detected-flash');
    const anchor = document.getElementById('book-anchor');

    anchor.addEventListener('xrimagefound', () => {
      hint.classList.add('hidden');
      flash.classList.add('show');
      setTimeout(() => flash.classList.remove('show'), 800);
    });

    anchor.addEventListener('xrimagelost', () => {
      hint.classList.remove('hidden');
    });
  </script>
